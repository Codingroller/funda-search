[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "funda-search"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "apscheduler>=3.10,<4",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "argon2-cffi>=23",
    "httpx>=0.27",
    "pyfunda>=3.1.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
