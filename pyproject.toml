[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funda-search"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "apscheduler>=3.10,<4",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "Pillow>=10",
    "argon2-cffi>=23",
    "httpx>=0.27",
    "pyfunda>=3.1.1",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "pydantic-settings>=2.2",
    "pywebpush>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-playwright>=0.5",
    "playwright>=1.45",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["e2e: end-to-end Playwright tests (run with -m e2e)"]
addopts = "-m 'not e2e'"
