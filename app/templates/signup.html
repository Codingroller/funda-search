<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Funda Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/design-system.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>Create account</h1>
    <p class="login-subtitle">Funda Search</p>
    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    {% if token %}
    <form method="post" action="/signup/{{ token }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autofocus required autocomplete="username" minlength="2">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
      </div>
      <div class="field" style="margin-bottom: 20px">
        <label for="password2">Confirm password</label>
        <input type="password" id="password2" name="password2" required autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Create account</button>
    </form>
    {% endif %}
  </div>
</body>
</html>
