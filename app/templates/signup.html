<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Funda Search</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>Create account</h1>
    <p class="text-muted" style="margin-bottom:20px;font-size:14px;text-align:center">Funda Search</p>
    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    {% if token %}
    <form method="post" action="/signup/{{ token }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autofocus required autocomplete="username" minlength="2">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
      </div>
      <div class="field">
        <label for="password2">Confirm password</label>
        <input type="password" id="password2" name="password2" required autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Create account</button>
    </form>
    {% endif %}
  </div>
</body>
</html>
