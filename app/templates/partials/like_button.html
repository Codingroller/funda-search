<button
  class="like-btn{% if size == 'lg' %} like-btn-lg{% endif %}{% if is_liked %} liked{% endif %}"
  hx-post="/listings/{{ global_id }}/like"
  hx-target="this"
  hx-swap="outerHTML"
  {% if size == 'lg' %}hx-vals='{"size": "lg"}'{% endif %}
  title="{% if is_liked %}Remove from liked{% else %}Save to liked{% endif %}"
  aria-label="{% if is_liked %}Unlike{% else %}Like{% endif %}"
>♥</button>
