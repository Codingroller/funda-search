{% if run %}
  {% if run.status == 'ok' %}
    {% if run.new_count > 0 %}
      <span class="badge badge-ok" title="{{ run.finished_at }}">
        +{{ run.new_count }} new / {{ run.result_count }} total
      </span>
    {% else %}
      <span class="run-last-search">last search: {{ run.finished_at.strftime('%d-%m-%Y %H:%M') }}</span>
    {% endif %}
  {% else %}
    <span class="badge badge-error" title="{{ run.error_message }}">Error</span>
  {% endif %}
{% endif %}
